[project]
name = "eu-verbatim"
version = "0.1.0"
description = "Dataset builder for the verbatim reports of European Parliament plenary sessions"
readme = "README.md"
authors = [
    { name = "Alexis Perrier", email = "alexis.perrier@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
]

[project.scripts]
eu-verbatim = "eu_verbatim.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits the European Parliament Open Data API (deselect with -m 'not live')"]
pythonpath = ["tests"]
